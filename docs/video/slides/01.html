<!doctype html><html><head><title>slide</title><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet"><style>
:root{--bg:#121417;--panel:#1B1E23;--ink:#F4F1EA;--muted:#9AA3B2;--line:#2A2F37;--brass:#C99A22;--brassHi:#E2B43A}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif}
.page{width:1920px;height:1080px;box-sizing:border-box;padding:84px 110px;display:flex;flex-direction:column;position:relative;overflow:hidden}
.glow{position:absolute;left:-200px;top:-320px;width:1100px;height:1100px;border-radius:50%;background:radial-gradient(closest-side,rgba(201,154,34,.16),rgba(201,154,34,0))}
.mark{font-family:'IBM Plex Mono',Menlo,monospace;font-size:26px;letter-spacing:.22em;text-transform:uppercase;color:var(--brass);font-weight:600}
h1{font-size:72px;line-height:1.05;margin:16px 0 10px;font-weight:800;letter-spacing:-.015em}
h1 b{color:var(--brassHi)}
.sub{font-size:28px;color:var(--muted);margin:0 0 30px}
.chip{position:absolute;right:110px;bottom:60px;font-family:'IBM Plex Mono',Menlo,monospace;font-size:18px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:10px 20px;background:var(--panel)}
pre{font-family:'IBM Plex Mono',Menlo,monospace;font-size:21px;line-height:1.42;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:26px 30px;margin:0;white-space:pre}
pre .c{color:var(--muted)} pre .k{color:var(--brassHi)}
table{border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;font-size:26px}
th,td{text-align:left;padding:14px 22px;border-top:1px solid var(--line)} thead th{border-top:0;font-size:17px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
td.n{font-family:'IBM Plex Mono',Menlo,monospace}
</style></head><body><div class="page"><div class="glow"></div><div style="margin:auto 0"><div class="mark" style="font-size:34px">Caliber</div>
<h1 style="font-size:132px;line-height:1;margin:28px 0 22px">The AP clerk that<br><b>can't pay itself.</b></h1>
<p class="sub" style="font-size:34px;max-width:1500px">Code decides. The investigator explains. The controller approves. The ledger refuses everything else.</p></div><span class="chip">Cal Hacks 13.0, October 2026</span></div></body></html>
